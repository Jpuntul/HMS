name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Lint/format gate. These hooks were configured in .pre-commit-config.yaml
  # and installed via requirements.txt, but nothing ever ran them in CI - they
  # only fired for contributors who had installed the git hook locally.
  #
  # The Node-dependent hooks (eslint, prettier, typescript-check) are skipped
  # here: they need `front/node_modules`, and the `frontend` job below already
  # covers that ground via `npm run lint` and `tsc -b` in the build.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit
      - name: Run pre-commit (python + general hooks)
        env:
          SKIP: eslint,typescript-check,prettier
        run: pre-commit run --all-files --show-diff-on-failure

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    env:
      # CI is not production. DEBUG=True activates settings.py's dev fallback
      # for SECRET_KEY; the explicit key is a belt-and-suspenders for any step
      # that flips DEBUG off. This key is throwaway and intentionally not a
      # secret - it never signs anything that leaves CI.
      DEBUG: "True"
      SECRET_KEY: "ci-only-throwaway-key-do-not-use-anywhere-else"
      ALLOWED_HOSTS: "localhost,127.0.0.1"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DB_NAME }}
          MYSQL_USER: ${{ secrets.DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        # Matches local dev (3.13). CompositePrimaryKey is new enough that
        # version skew between CI and dev is a real risk surface.
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for MySQL
        run: |
          for i in {30..0}; do
            if mysqladmin ping -h 127.0.0.1 --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 1
          done
          if [ "$i" = 0 ]; then
            echo "MySQL failed to start"
            exit 1
          fi

      - name: Run migrations
        run: |
          python manage.py migrate
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DJANGO_SETTINGS_MODULE: hms.settings

      # Production-readiness checks. Run with DEBUG=False and a realistic
      # SECRET_KEY so the output reflects a deploy, not CI's dev fallback.
      # Advisory: --fail-level ERROR means security.W* warnings are reported
      # without breaking the build.
      - name: Django deployment checks
        run: |
          python manage.py check --deploy --fail-level ERROR
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-only-throwaway-key-not-a-secret-abcdefghijklmnopqrstuvwxyz0123456789"
          ALLOWED_HOSTS: "example.com"
          CORS_ALLOWED_ORIGINS: "https://example.com"
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DJANGO_SETTINGS_MODULE: hms.settings

      # NOTE: `python manage.py check_schema_sync` is deliberately NOT wired in
      # here yet, despite its docstring saying it should be.
      #
      # Every domain model is `managed = False`, so `migrate` creates none of
      # the domain tables (Persons, Employees, ...) in CI's empty database -
      # the drift check would fail on "table not found" every run.
      #
      # It becomes runnable once the schema is reproducible in CI (checked-in
      # schema.sql loaded before this step is the leading option). That same
      # prerequisite is what currently blocks writing any test that touches a
      # domain model - see notes/AUDIT_2026-08-18.md section 2.1.

      # Currently vacuous: there are no tests yet, blocked on the same
      # reproducible-schema prerequisite described above. Kept so the step
      # exists the moment that changes.
      - name: Run tests
        run: |
          python manage.py test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DJANGO_SETTINGS_MODULE: hms.settings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: front/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run build
        run: npm run build
